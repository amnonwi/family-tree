<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Family Tree (custom)</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
    #tree { width: 100%; height: 100vh; background: #fff; }

    /* SVG fills the viewport */
    #tree svg { width: 100%; height: 100%; display: block; }

    /* Graph nodes */
    .node-card{
      width: 240px;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      background: #fff;
      text-align: center;
      direction: rtl;
      color: #111;
      overflow: hidden;
    }
    .node-card .name1{
      font-size: 16px;
      font-weight: 700;
      color: #111;
      line-height: 1.15;
    }
    .node-card .name2{
      font-size: 13px;
      color: #111;
      margin-top: 2px;
      line-height: 1.15;
    }
    .node-card .comment{
      font-size: 12px;
      margin-top: 6px;
      color: #111;
      white-space: pre-wrap;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .node-card .meta{
      font-size: 12px;
      margin-top: 6px;
      color: #111;
      line-height: 1.2;
    }
    .node-card .meta.muted{
      margin-top: 2px;
      color: #444;
    }

    /* dagre-d3 shapes */
    g.node rect{
      fill: transparent; /* we draw card via foreignObject */
      stroke: transparent;
    }
    g.node.is-selected foreignObject .node-card{
      outline: 4px solid rgba(30, 136, 229, 0.25);
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    }
    g.edgePath path{
      stroke: #9ca3af;
      stroke-width: 2px;
      fill: none;
    }
    g.edgePath.spouse path{
      stroke: #6b7280;
      stroke-width: 2px;
      stroke-dasharray: 4 3;
      opacity: 0.85;
    }

    /* Search UI */
    #searchBar{
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(255,255,255,0.95);
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      flex-wrap: wrap;
      max-width: calc(100vw - 24px);
    }
    #searchInput{
      width: 240px;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
    }
    #searchBtn, #clearBtn{
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #fff;
      cursor: pointer;
    }
    #clearBtn{ padding: 8px 10px; }

    #searchResults{
      position: fixed;
      top: 62px;
      right: 12px;
      z-index: 9999;
      width: 360px;
      max-height: 340px;
      overflow: auto;
      background: rgba(255,255,255,0.98);
      border: 1px solid #d1d5db;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }
    .sr-item{
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      direction: rtl;
      text-align: right;
    }
    .sr-item:last-child{ border-bottom: none; }
    .sr-item:hover{ background: #f3f4f6; }

    /* Fixed note (bottom-left) */
    #footerNote {
      position: fixed;
      bottom: 12px;
      left: 12px;
      z-index: 9999;
      background: rgba(255,255,255,0.9);
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      color: #111;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      direction: rtl;
      text-align: right;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      #searchBar{
        top: 8px;
        right: 8px;
        left: 8px;
        width: auto;
        gap: 6px;
        padding: 8px;
        border-radius: 12px;
      }

      #searchInput{
        width: 100%;
        flex: 1 1 100%;
        font-size: 16px;
      }

      #searchBtn, #clearBtn{
        flex: 1 1 auto;
        padding: 10px 12px;
        font-size: 14px;
      }

      #searchResults{
        top: 112px;
        right: 8px;
        left: 8px;
        width: auto;
        max-height: 45vh;
      }

      #footerNote{
        left: 8px;
        right: 8px;
        bottom: 8px;
        font-size: 12px;
        white-space: normal;
      }
    }

    #nodeCount{
      font-size: 12px;
      color: #374151;
      background: #F3F4F6;
      border: 1px solid #D1D5DB;
      border-radius: 999px;
      padding: 4px 8px;
      white-space: nowrap;
      order: 2;
    }

    #toggles{
      display: flex;
      gap: 10px;
      align-items: center;
      order: 3;
      font-size: 12px;
      color: #374151;
      white-space: nowrap;
    }
    #toggles label{
      display: inline-flex;
      gap: 6px;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>

<body>

  <!-- Search UI -->
  <div id="searchBar">
    <input id="searchInput" type="search" placeholder="חיפוש לפי שם..." autocomplete="off" />
    <span id="nodeCount"></span>
    <div id="toggles">
      <label><input id="toggleSpouses" type="checkbox" checked /> הצג בני זוג</label>
    </div>
    <button id="searchBtn">חפש</button>
    <button id="clearBtn" title="נקה">✕</button>
  </div>

  <div id="searchResults" hidden></div>
  <div id="tree"></div>

  <!-- Alternative to balkan.app/familytree2.js:
       D3 + dagre-d3 gives a fully-customizable graph renderer with HTML node templates -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dagre-d3@0.6.4/dist/dagre-d3.min.js"></script>
  <script src="members.js"></script>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (!window.members || !Array.isArray(window.members) || window.members.length === 0) {
        console.error("members.js did not define window.members (or it's empty).");
        return;
      }

      const members = window.members;
      document.getElementById("nodeCount").textContent = `סה״כ ${members.length}`;

      // ---------- Root ----------
      const ROOT_ID = 1000;

      // ----------------- Indexes -----------------
      const byId = new Map(members.map(m => [m.id, m]));

      // parentId -> [childId...]
      const childrenOf = new Map();
      for (const m of members) {
        if (m.fatherId && m.fatherId !== m.id) {
          if (!childrenOf.has(m.fatherId)) childrenOf.set(m.fatherId, []);
          childrenOf.get(m.fatherId).push(m.id);
        }
        if (m.motherId && m.motherId !== m.id) {
          if (!childrenOf.has(m.motherId)) childrenOf.set(m.motherId, []);
          childrenOf.get(m.motherId).push(m.id);
        }
        if (Array.isArray(m.childIds)) {
          for (const cid of m.childIds) {
            if (!cid || cid === m.id) continue;
            if (!childrenOf.has(m.id)) childrenOf.set(m.id, []);
            childrenOf.get(m.id).push(cid);
          }
        }
      }

      function parentsOf(id) {
        const m = byId.get(id);
        if (!m) return [];
        const out = [];
        if (m.fatherId && m.fatherId !== id) out.push(m.fatherId);
        if (m.motherId && m.motherId !== id) out.push(m.motherId);
        return out;
      }

      // ----------------- Root -----------------
      const root = byId.get(ROOT_ID) || members[0];
      if (!byId.get(ROOT_ID)) {
        console.warn(`Root id ${ROOT_ID} not found; falling back to members[0].`);
      }

      // ----------------- Generation colors -----------------
      const genPalette = [
        "#1E88E5", "#43A047", "#FB8C00", "#8E24AA", "#D81B60",
        "#00ACC1", "#7CB342", "#FDD835", "#5E35B1", "#F4511E"
      ];

      // BFS levels: root=0, children=+1, parents=-1
      const level = new Map();
      const qGen = [root.id];
      level.set(root.id, 0);

      while (qGen.length) {
        const cur = qGen.shift();
        const curLevel = level.get(cur);

        for (const cid of (childrenOf.get(cur) || [])) {
          if (!level.has(cid)) {
            level.set(cid, curLevel + 1);
            qGen.push(cid);
          }
        }
        for (const pid of parentsOf(cur)) {
          if (!level.has(pid)) {
            level.set(pid, curLevel - 1);
            qGen.push(pid);
          }
        }
      }

      // Apply generation color to BORDER; keep interior white for all nodes.
      for (const m of members) {
        const l = (level.has(m.id) ? level.get(m.id) : 0);
        const idx = ((l % genPalette.length) + genPalette.length) % genPalette.length;

        m.color = "#ffffff";
        if (!m.borderColor) m.borderColor = genPalette[idx];
      }

      // ----------------- Graph renderer (dagre-d3) -----------------
      const treeEl = document.getElementById("tree");
      treeEl.innerHTML = "";

      const svg = d3.select(treeEl).append("svg");
      const inner = svg.append("g");

      const zoom = d3.zoom().scaleExtent([0.08, 2.5]).on("zoom", (event) => {
        inner.attr("transform", event.transform);
      });
      svg.call(zoom);

      function normalizeName(s) {
        return String(s || "")
          .normalize("NFKD")
          .replace(/[\u0591-\u05C7]/g, "") // remove niqqud/cantillation
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();
      }

      function nodeHtml(m) {
        const heb = String(m.hebrewName || "").trim();
        const eng = String(m.englishName || "").trim();
        const comment = String(m.comment || "").trim();

        const birthG = String(m.birthDate || "").trim();
        const birthH = String(m.hebrewBirthDate || "").trim();
        const deathG = String(m.deathDate || "").trim();
        const deathH = String(m.deathHebrewDate || "").trim();

        const line1 = heb || eng || String(m.id);
        const line2 = (heb && eng) ? eng : "";

        const border = m.borderColor || "#d1d5db";
        const bg = m.color || "#fff";

        const birth = (birthG || birthH)
          ? `<div class="meta"><bdi>לידה</bdi> ${birthG ? `<bdi>${escapeHtml_(birthG)}</bdi>` : ""}${birthG && birthH ? " " : ""}${birthH ? `(<bdi>${escapeHtml_(birthH)}</bdi>)` : ""}</div>`
          : "";
        const death = (deathG || deathH)
          ? `<div class="meta muted"><bdi>פטירה</bdi> ${deathG ? `<bdi>${escapeHtml_(deathG)}</bdi>` : ""}${deathG && deathH ? " " : ""}${deathH ? `(<bdi>${escapeHtml_(deathH)}</bdi>)` : ""}</div>`
          : "";

        return `
          <div class="node-card" style="background:${bg}; border:7px solid ${border};">
            <div class="name1"><bdi>${escapeHtml_(line1)}</bdi></div>
            ${line2 ? `<div class="name2"><bdi>${escapeHtml_(line2)}</bdi></div>` : ""}
            ${comment ? `<div class="comment"><bdi>${escapeHtml_(comment)}</bdi></div>` : ""}
            ${birth}
            ${death}
          </div>
        `;
      }

      function buildGraph({ showSpouses }) {
        const g = new dagreD3.graphlib.Graph({ multigraph: true })
          .setGraph({
            rankdir: "TB",
            nodesep: 28,
            ranksep: 90,
            marginx: 20,
            marginy: 20
          })
          .setDefaultEdgeLabel(() => ({}));

        // Nodes
        for (const m of members) {
          g.setNode(String(m.id), {
            labelType: "html",
            label: nodeHtml(m),
            width: 240,
            height: 160,
            rx: 10,
            ry: 10
          });
        }

        const edgeKeys = new Set();
        const addEdge = (from, to, attrs) => {
          if (!from || !to) return;
          if (from === to) return;
          const k = `${from}->${to}|${attrs && attrs._k ? attrs._k : ""}`;
          if (edgeKeys.has(k)) return;
          edgeKeys.add(k);
          g.setEdge(String(from), String(to), attrs || {});
        };

        // Parent -> child edges (rank constraints)
        for (const m of members) {
          if (m.fatherId && m.fatherId !== m.id) addEdge(m.fatherId, m.id, { arrowhead: "none", lineInterpolate: "basis", _k: "p" });
          if (m.motherId && m.motherId !== m.id) addEdge(m.motherId, m.id, { arrowhead: "none", lineInterpolate: "basis", _k: "p" });
        }

        // Spouse edges (do not affect ranks)
        if (showSpouses) {
          const spousePairs = new Set();
          for (const m of members) {
            if (!Array.isArray(m.spouseIds)) continue;
            for (const sid of m.spouseIds) {
              if (!sid || sid === m.id) continue;
              const a = String(Math.min(m.id, sid));
              const b = String(Math.max(m.id, sid));
              const key = `${a}-${b}`;
              if (spousePairs.has(key)) continue;
              spousePairs.add(key);
              g.setEdge(String(a), String(b), {
                arrowhead: "none",
                curve: d3.curveBasis,
                class: "spouse",
                constraint: false,
                _k: "s"
              }, `spouse:${key}`);
            }
          }
        }

        return g;
      }

      function renderGraph(selectedId) {
        const showSpouses = !!document.getElementById("toggleSpouses")?.checked;
        const g = buildGraph({ showSpouses });

        inner.selectAll("*").remove();
        const renderer = new dagreD3.render();
        renderer(inner, g);

        // Tag spouse edges for CSS styling
        inner.selectAll("g.edgePath").each(function(d) {
          const edge = g.edge(d);
          if (edge && edge.class === "spouse") {
            d3.select(this).classed("spouse", true);
          }
        });

        // Fit to screen initially (or preserve selection focus)
        const { width: vw, height: vh } = treeEl.getBoundingClientRect();
        const graphW = g.graph().width || 1;
        const graphH = g.graph().height || 1;
        const scale = Math.min(1, 0.92 * Math.min(vw / graphW, vh / graphH));
        const tx = (vw - graphW * scale) / 2;
        const ty = (vh - graphH * scale) / 2;
        svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));

        if (selectedId != null) {
          selectAndCenter(g, selectedId, { animate: false });
        }

        // Click-to-select
        inner.selectAll("g.node").on("click", function(e, id) {
          e.stopPropagation();
          selectAndCenter(g, id, { animate: true });
        });

        // Background click clears selection
        svg.on("click", () => {
          inner.selectAll("g.node").classed("is-selected", false);
        });

        return g;
      }

      function selectAndCenter(g, id, { animate }) {
        const sid = String(id);
        inner.selectAll("g.node").classed("is-selected", false);
        inner.select(`g.node[id='${cssEscape_(sid)}']`).classed("is-selected", true);

        const n = g.node(sid);
        if (!n) return;
        const { width: vw, height: vh } = treeEl.getBoundingClientRect();
        const targetScale = Math.min(1.2, Math.max(0.22, d3.zoomTransform(svg.node()).k));
        const t = d3.zoomIdentity
          .translate(vw / 2 - n.x * targetScale, vh / 2 - n.y * targetScale)
          .scale(targetScale);
        const sel = animate ? svg.transition().duration(550) : svg;
        sel.call(zoom.transform, t);
      }

      // ----------------- Search -----------------
      // Search by Hebrew + English, show both in results when available
      const searchable = members.map(m => {
        const heb = String(m.hebrewName || "").trim();
        const eng = String(m.englishName || "").trim();
        const combined = (heb + " " + eng).trim();

        return {
          id: m.id,
          hebrewName: heb,
          englishName: eng,
          searchN: normalizeName(combined)
        };
      });

      function findMatches(query) {
        const nq = normalizeName(query);
        if (!nq) return [];
        return searchable.filter(x => x.searchN.includes(nq)).slice(0, 30);
      }

      // ----------------- Wire Search UI -----------------
      const elInput = document.getElementById("searchInput");
      const elBtn = document.getElementById("searchBtn");
      const elClear = document.getElementById("clearBtn");
      const elResults = document.getElementById("searchResults");
      const elToggleSpouses = document.getElementById("toggleSpouses");

      function hideResults() {
        elResults.hidden = true;
        elResults.innerHTML = "";
      }

      function renderResults(list) {
        if (!list.length) {
          elResults.hidden = false;
          elResults.innerHTML = `<div class="sr-item">לא נמצאו תוצאות</div>`;
          return;
        }

        elResults.hidden = false;
        elResults.innerHTML = list.map(x => {
          const heb = String(x.hebrewName || "").trim();
          const eng = String(x.englishName || "").trim();

          const line1 = heb || eng || String(x.id);
          const line2 = (heb && eng) ? eng : "";

          return `
            <div class="sr-item" data-id="${x.id}">
              <div><bdi>${escapeHtml_(line1)}</bdi></div>
              ${line2 ? `<div style="font-size:12px; color:#555; margin-top:2px;"><bdi>${escapeHtml_(line2)}</bdi></div>` : ""}
            </div>
          `;
        }).join("");
      }

      function doSearch() {
        renderResults(findMatches(elInput.value));
      }

      elBtn.addEventListener("click", doSearch);
      elInput.addEventListener("input", doSearch);
      elInput.addEventListener("keydown", (e) => {
        if (e.key === "Escape") hideResults();
        if (e.key === "Enter") doSearch();
      });

      elClear.addEventListener("click", () => {
        elInput.value = "";
        hideResults();
      });

      elResults.addEventListener("click", (e) => {
        const item = e.target.closest(".sr-item");
        if (!item) return;
        const id = Number(item.getAttribute("data-id"));
        if (!id) return;
        hideResults();
        // Re-render (if needed due to toggles) and center
        const g = renderGraph(id);
        selectAndCenter(g, id, { animate: true });
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest("#searchBar") && !e.target.closest("#searchResults")) hideResults();
      });

      // Re-render when toggles change
      if (elToggleSpouses) {
        elToggleSpouses.addEventListener("change", () => {
          renderGraph(root.id);
        });
      }

      // ----------------- Initial render -----------------
      renderGraph(root.id);
      // Center root after first render
      setTimeout(() => {
        // best-effort: rebuild + center without animation
        const g = renderGraph(root.id);
        selectAndCenter(g, root.id, { animate: false });
      }, 0);
    });

    function escapeHtml_(s) {
      return String(s || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function cssEscape_(s) {
      // Minimal escape for attribute selector usage in query strings
      return String(s || "").replaceAll("\\", "\\\\").replaceAll("'", "\\'");
    }
  </script>

  <div id="footerNote">
    הערות אפשר לשלוח למייל
    <a href="mailto:amnonw@gmail.com" style="color:#1E88E5; text-decoration:none;">
      amnonw@gmail.com
    </a>
  </div>

</body>
</html>
