<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Family Tree Search</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: rgba(255, 255, 255, 0.92);
        --border: #d1d5db;
        --text: #111827;
        --muted: #6b7280;
        --shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(1200px 700px at 80% 0%, #142449 0%, var(--bg) 55%);
      }

      .topbar {
        position: fixed;
        inset: 12px 12px auto 12px;
        z-index: 10;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .topbar input[type="search"] {
        flex: 1 1 320px;
        min-width: 220px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        outline: none;
        font-size: 16px;
      }

      .pill {
        font-size: 12px;
        color: #374151;
        background: #f3f4f6;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 10px;
        white-space: nowrap;
      }

      .btn {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: white;
        cursor: pointer;
        font-size: 14px;
      }

      .results {
        position: fixed;
        top: 72px;
        right: 12px;
        left: 12px;
        z-index: 10;
        max-width: 720px;
        margin-left: auto;
        margin-right: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .results[hidden] {
        display: none;
      }

      .results .item {
        padding: 10px 12px;
        cursor: pointer;
        border-bottom: 1px solid rgba(209, 213, 219, 0.6);
      }

      .results .item:last-child {
        border-bottom: none;
      }

      .results .item:hover,
      .results .item[aria-selected="true"] {
        background: #eef2ff;
      }

      .results .primary {
        color: var(--text);
        font-weight: 650;
      }

      .results .secondary {
        margin-top: 2px;
        font-size: 12px;
        color: var(--muted);
      }

      .stage {
        height: 100%;
        padding-top: 92px;
        box-sizing: border-box;
      }

      #empty {
        height: calc(100vh - 92px);
        display: grid;
        place-items: center;
        color: white;
        text-align: center;
        padding: 24px;
      }

      #empty .card {
        max-width: 720px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 18px;
        padding: 22px 18px;
        backdrop-filter: blur(10px);
      }

      #empty h2 {
        margin: 0 0 10px 0;
        font-size: 20px;
        font-weight: 750;
      }

      #empty p {
        margin: 0;
        color: rgba(255, 255, 255, 0.85);
        line-height: 1.45;
      }

      #treeWrap {
        height: calc(100vh - 92px);
        display: none;
        background: #ffffff;
      }

      #tree {
        width: 100%;
        height: 100%;
      }

      @media (min-width: 760px) {
        .results {
          left: auto;
          width: 560px;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar" role="search">
      <input
        id="q"
        type="search"
        placeholder="חפש/י לפי שם בעברית או באנגלית…"
        autocomplete="off"
        aria-label="Search by hebrewName or englishName"
      />
      <span id="count" class="pill" title="Number of members"></span>
      <button id="clear" class="btn" type="button" title="Clear">נקה</button>
    </div>

    <div id="results" class="results" hidden aria-label="Search results"></div>

    <div class="stage">
      <div id="empty">
        <div class="card">
          <h2>חיפוש עץ משפחה</h2>
          <p>
            הדף מתחיל ריק. הקלד/י שם למעלה כדי למצוא אדם לפי
            <bdi><b>hebrewName</b></bdi> או <bdi><b>englishName</b></bdi>,
            בחר/י תוצאה, ואז אפשר לנווט בעץ בלחיצה על אנשים.
          </p>
        </div>
      </div>

      <div id="treeWrap">
        <div id="tree"></div>
      </div>
    </div>

    <script src="https://cdn.balkan.app/familytree2.js"></script>
    <script src="members.js"></script>
    <script>
      // --- small helpers ---
      function escapeHtml_(s) {
        return String(s || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function normalizeName_(s) {
        return String(s || "")
          .normalize("NFKD")
          .replace(/[\u0591-\u05C7]/g, "") // remove niqqud/cantillation
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();
      }

      window.addEventListener("DOMContentLoaded", () => {
        const members = Array.isArray(window.members) ? window.members : [];
        const FamilyTreeCtor =
          typeof window.FamilyTree2 !== "undefined"
            ? window.FamilyTree2
            : typeof window.FamilyTree !== "undefined"
              ? window.FamilyTree
              : null;

        if (!FamilyTreeCtor) {
          document.getElementById("empty").innerHTML =
            '<div class="card"><h2>שגיאה</h2><p>לא הצלחתי לטעון את <bdi><b>familytree2.js</b></bdi>. בדוק/י חיבור רשת / כתובת CDN.</p></div>';
          return;
        }

        if (!members.length) {
          document.getElementById("empty").innerHTML =
            '<div class="card"><h2>שגיאה</h2><p>לא נמצא מידע ב-<bdi><b>members.js</b></bdi> (צריך <bdi><b>window.members</b></bdi> שהוא מערך).</p></div>';
          return;
        }

        const byId = new Map(members.map((m) => [m.id, m]));
        const childrenOf = new Map(); // parentId -> childIds[]
        for (const m of members) {
          if (m.fatherId) {
            if (!childrenOf.has(m.fatherId)) childrenOf.set(m.fatherId, []);
            childrenOf.get(m.fatherId).push(m.id);
          }
          if (m.motherId) {
            if (!childrenOf.has(m.motherId)) childrenOf.set(m.motherId, []);
            childrenOf.get(m.motherId).push(m.id);
          }
        }

        const searchable = members.map((m) => {
          const heb = String(m.hebrewName || "").trim();
          const eng = String(m.englishName || "").trim();
          return {
            id: m.id,
            hebrewName: heb,
            englishName: eng,
            searchN: normalizeName_(heb + " " + eng),
          };
        });

        // Fallback shape for non-"addFamilyMembers" APIs
        const nodesForTree = members.map((m) => ({
          id: m.id,
          fid: m.fatherId || null,
          mid: m.motherId || null,
          pids: Array.isArray(m.spouseIds) ? m.spouseIds : [],
          name: String(m.hebrewName || m.englishName || "").trim(),
          hebrewName: m.hebrewName || "",
          englishName: m.englishName || "",
        }));

        const elQ = document.getElementById("q");
        const elClear = document.getElementById("clear");
        const elResults = document.getElementById("results");
        document.getElementById("count").textContent = `סה״כ ${members.length}`;

        let activeIndex = -1;
        let lastResults = [];
        let tree = null;
        let treeLoaded = false;

        function directNeighborhood_(id) {
          const m = byId.get(id);
          const out = new Set([id]);
          if (!m) return out;
          if (m.fatherId) out.add(m.fatherId);
          if (m.motherId) out.add(m.motherId);
          if (Array.isArray(m.spouseIds)) for (const sid of m.spouseIds) out.add(sid);
          for (const cid of childrenOf.get(id) || []) out.add(cid);
          return out;
        }

        function showTree_() {
          document.getElementById("treeWrap").style.display = "block";
          document.getElementById("empty").style.display = "none";
        }

        function hideResults_() {
          elResults.hidden = true;
          elResults.innerHTML = "";
          activeIndex = -1;
          lastResults = [];
        }

        function renderResults_(list) {
          lastResults = list;
          activeIndex = list.length ? 0 : -1;
          elResults.hidden = false;

          if (!list.length) {
            elResults.innerHTML =
              '<div class="item"><div class="primary">לא נמצאו תוצאות</div></div>';
            return;
          }

          elResults.innerHTML = list
            .map((x, idx) => {
              const heb = String(x.hebrewName || "").trim();
              const eng = String(x.englishName || "").trim();
              const primary = heb || eng || String(x.id);
              const secondary = heb && eng ? eng : "";
              return `
                <div class="item" role="option" data-id="${x.id}" aria-selected="${idx === activeIndex}">
                  <div class="primary"><bdi>${escapeHtml_(primary)}</bdi></div>
                  ${secondary ? `<div class="secondary"><bdi>${escapeHtml_(secondary)}</bdi></div>` : ""}
                </div>
              `;
            })
            .join("");
        }

        function findMatches_(q) {
          const nq = normalizeName_(q);
          if (!nq) return [];
          // simple contains match; keep fast and predictable
          return searchable.filter((x) => x.searchN.includes(nq)).slice(0, 40);
        }

        function ensureTree_() {
          if (tree) return;
          tree = new FamilyTreeCtor(document.getElementById("tree"));

          // Simple node card: Hebrew + English (if present)
          if (tree.template && typeof tree.template === "object") {
            tree.template.html = function (node) {
              const m = node.familyMember || node || {};
              const heb = String(m.hebrewName || "").trim();
              const eng = String(m.englishName || "").trim();
              const line1 = heb || eng || "";
              const line2 = heb && eng ? eng : "";
              return `
                <div style="
                  padding:12px 14px;
                  direction: rtl;
                  text-align: center;
                  background:#fff;
                  border:2px solid #e5e7eb;
                  border-radius:12px;
                  box-sizing:border-box;
                  color:#111;
                ">
                  <div style="font-size:15px; font-weight:750;"><bdi>${escapeHtml_(line1)}</bdi></div>
                  ${line2 ? `<div style="font-size:12px; color:#6b7280; margin-top:2px;"><bdi>${escapeHtml_(line2)}</bdi></div>` : ""}
                </div>
              `;
            };
          }
        }

        function focusPerson_(id) {
          ensureTree_();
          showTree_();

          // Collapse everything except the selected person + immediate family.
          const keep = directNeighborhood_(id);
          const collapsed = members.map((m) => m.id).filter((mid) => !keep.has(mid));
          tree.collapsedIds = collapsed;

          if (!treeLoaded) {
            if (typeof tree.addFamilyMembers === "function") {
              tree.addFamilyMembers(members);
              treeLoaded = true;
            } else if (typeof tree.load === "function") {
              tree.load(nodesForTree);
              treeLoaded = true;
            }
          }

          // Draw / center on the selected node (method name differs by version)
          if (typeof tree.draw === "function") {
            tree.draw(id);
          } else if (typeof tree.center === "function") {
            tree.center(id);
          }
        }

        function selectActive_() {
          if (activeIndex < 0 || activeIndex >= lastResults.length) return;
          const id = Number(lastResults[activeIndex].id);
          if (!id) return;
          hideResults_();
          focusPerson_(id);
        }

        elQ.addEventListener("input", () => {
          const q = elQ.value;
          if (!q.trim()) {
            hideResults_();
            return;
          }
          renderResults_(findMatches_(q));
        });

        elQ.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            hideResults_();
            return;
          }
          if (e.key === "Enter") {
            selectActive_();
            return;
          }
          if (!lastResults.length) return;
          if (e.key === "ArrowDown") {
            e.preventDefault();
            activeIndex = Math.min(activeIndex + 1, lastResults.length - 1);
            renderResults_(lastResults);
          }
          if (e.key === "ArrowUp") {
            e.preventDefault();
            activeIndex = Math.max(activeIndex - 1, 0);
            renderResults_(lastResults);
          }
        });

        elClear.addEventListener("click", () => {
          elQ.value = "";
          hideResults_();
          elQ.focus();
        });

        elResults.addEventListener("click", (e) => {
          const item = e.target.closest(".item");
          if (!item) return;
          const id = Number(item.getAttribute("data-id"));
          if (!id) return;
          hideResults_();
          focusPerson_(id);
        });

        document.addEventListener("click", (e) => {
          if (!e.target.closest(".topbar") && !e.target.closest("#results")) hideResults_();
        });

        // start focused in the search box
        elQ.focus();
      });
    </script>
  </body>
</html>
